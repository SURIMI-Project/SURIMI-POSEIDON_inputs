name: Sync repo to S3

on:
  push:
    branches:
      - master

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      # Read only by local runs and calibration, never by the deployed service (the controller
      # sends biomass and prices, and Anchovy Bay is not served yet), so they are neither
      # downloaded from LFS nor synced
      LOCAL_ONLY: "northwestern_med/biomass_grids.nc,northwestern_med/prices.csv,northwestern_med/target_landings.csv,anchovy_bay/anchovy_bay.eiixml,anchovy_bay/anchovy_bay.sqlite"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Fetch the LFS files to sync
        # Without this, the LFS-tracked files are uploaded as pointer files
        run: git lfs pull --exclude="${LOCAL_ONLY}"

      - name: Sync to S3
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_ENDPOINT: "https://minio.dive.edito.eu"
          AWS_REGION: "waw3-1"
          AWS_S3_PREFIX: "poseidon"
        run: |
          # Avoid multipart upload on S3-compatible backends that reject it
          aws configure set default.s3.multipart_threshold 5GB
          aws configure set default.s3.multipart_chunksize 5GB
          aws configure set default.s3.max_concurrent_requests 1

          local_only_excludes=()
          IFS=, read -ra local_only <<< "${LOCAL_ONLY}"
          for path in "${local_only[@]}"; do
            local_only_excludes+=(--exclude "${path}")
          done

          # --delete leaves excluded files alone: one already in the bucket must be removed there
          aws s3 sync . "s3://${AWS_S3_BUCKET}/${AWS_S3_PREFIX}/" \
            --endpoint-url "${AWS_S3_ENDPOINT}" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            "${local_only_excludes[@]}"
