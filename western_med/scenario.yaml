    currencyColumn: currency
    data: !!uk.ac.ox.poseidon.io.tables.CsvTableFactory
      dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
        encoding: UTF-8
        path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: *id001
          path: prices.csv
    dateColumn: date
    measurementUnitColumn: measurement_unit
    portCodeColumn: market_code
    portGrid: &id007 !!uk.ac.ox.poseidon.geography.ports.PortGridFactory
      bathymetricGrid: *id003
      distanceCalculator: &id010 !!uk.ac.ox.poseidon.geography.distance.HaversineDistanceCalculatorFactory
        modelGrid: *id004
      ports: !!uk.ac.ox.poseidon.geography.ports.PortsFromTableFactory
