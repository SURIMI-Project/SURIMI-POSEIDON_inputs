        longitudeColumnName: lon
        portCodeColumnName: port_code
        portNameColumnName: port_name
        table: !!uk.ac.ox.poseidon.io.tables.CsvTableFactory
          dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
            encoding: UTF-8
            path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
              parent: *id001
              path: ports.csv
    priceColumn: price
    species: *id006
    speciesCodeColumn: species_code
  portGrid: *id007
  regulations: &id011 !!uk.ac.ox.poseidon.regulations.ForbiddenIfFactory
    actionPredicate: !!uk.ac.ox.poseidon.core.predicates.logical.AnyOfFactory
      predicates:
      - !!uk.ac.ox.poseidon.regulations.predicates.spatial.ActionCellPredicateFactory
        cellPredicate: !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
          extractor: !!uk.ac.ox.poseidon.geography.grids.extractors.CellValueFactory
            grid: *id003
          predicate: !!uk.ac.ox.poseidon.core.predicates.numeric.GreaterThanFactory {
            threshold: -35.0
          }
        modelGrid: *id004
      - !!uk.ac.ox.poseidon.regulations.predicates.spatial.ActionCellPredicateFactory
        cellPredicate: !!uk.ac.ox.poseidon.core.predicates.InSetFactory
          values: !!uk.ac.ox.poseidon.geography.grids.CellSetFromGridFileFactory
            includedValue: 1.0
            path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
              parent: *id001
              path: french_eez.asc
        modelGrid: *id004
  totalAllowableCatchQuotas: &id009 !!uk.ac.ox.poseidon.core.schedule.ScheduledRepeatingFromStartFactory
    interval: &id028 !!uk.ac.ox.poseidon.core.time.PeriodFactory {
      days: 1,
      months: 0,
      years: 0
    }
    ordering: 0
    steppable: !!eu.project.surimi.poseidon.regulations.TotalAllowableCatchQuotasFactory
      fleetSegmentMapper: !!eu.project.surimi.poseidon.server.fleet.FleetSegmentMapperFactory
