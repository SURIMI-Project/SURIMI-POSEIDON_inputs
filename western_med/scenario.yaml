          - {
            lowerBoundInclusive: 0.0,
            upperBoundExclusive: 6.0,
            value: VL0006
          }
          - {
            lowerBoundInclusive: 6.0,
            upperBoundExclusive: 12.0,
            value: VL0612
          }
          - {
            lowerBoundInclusive: 12.0,
            upperBoundExclusive: 18.0,
            value: VL1218
          }
          - {
            lowerBoundInclusive: 18.0,
            upperBoundExclusive: 24.0,
            value: VL1824
          }
          - {
            lowerBoundInclusive: 24.0,
            upperBoundExclusive: 40.0,
            value: VL2440
          }
          - {
            lowerBoundInclusive: 40.0,
            upperBoundExclusive: null,
            value: VL40XX
          }
        vesselLengthTag: loa
  vesselField: &id027 !!uk.ac.ox.poseidon.agents.fields.VesselFieldFactory
