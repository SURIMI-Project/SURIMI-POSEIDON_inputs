                        componentRegister: &id011 !!uk.ac.ox.poseidon.agents.components.ComponentRegisterFactory {
                          }
                      optionValuesSupplier: !!uk.ac.ox.poseidon.agents.choices.BestOptionsFromFriendsSupplierFactory
                        maxNumberOfFriends: 5
                        optionValuesRegister: *id011
                    explorer: !!uk.ac.ox.poseidon.agents.choices.NeighbourhoodGridExplorerFactory
                      cellPredicate: *id012
                      neighbourhoodSizeSupplier: !!uk.ac.ox.poseidon.core.suppliers.ShiftedIntSupplierFactory
                        intSupplier: !!uk.ac.ox.poseidon.core.suppliers.PoissonIntSupplierFactory {
                          mean: 1.0
