                    function2: !!uk.ac.ox.poseidon.core.functions.MapValueExtractorFactory
                      map: !!uk.ac.ox.poseidon.io.tables.MapFromTableFactory
                        keyBuilder: &id017 !!uk.ac.ox.poseidon.io.tables.MultiKeyFromRowFactory
                          keyColumnNames: [
                            species_code,
                            life_stage
