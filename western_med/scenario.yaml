        proportionSupplier: !!uk.ac.ox.poseidon.core.providers.constant.ConstantDoubleProviderFromValueFactory {
          value: 1.0
        }
    modelGrid: *id004
    species: *id006
  marketGrid: &id026 !!uk.ac.ox.poseidon.agents.market.BiomassMarketGridFromPriceTableFactory
