!!uk.ac.ox.poseidon.core.Scenario
components:
  species: &id006 !!uk.ac.ox.poseidon.biology.species.SpeciesFromDataFactory
    data: !!uk.ac.ox.poseidon.io.tables.CsvTableFactory
      dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
        encoding: UTF-8
        path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: &id001 !!uk.ac.ox.poseidon.io.paths.RootPathFactory {
            path: inputs/western_med
          }
          path: species.csv
    lifeStageColumn: life_stage
    speciesCodeColumn: species_code
    speciesNameColumn: species_name
  bathymetricGrid: &id003 !!uk.ac.ox.poseidon.geography.bathymetry.BathymetricGridFromGridFileFactory
    aggregator: !!uk.ac.ox.poseidon.core.aggregators.MaxFactory {
      }
    inverted: false
    modelGrid: &id004 !!uk.ac.ox.poseidon.geography.grids.ModelGridWithActiveCellsFactory
      activeCells: !!uk.ac.ox.poseidon.geography.grids.CellSetFromGridFileFactory
        includedValue: 0.0
        path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: *id001
          path: exclusion_grid.asc
      modelGrid: !!uk.ac.ox.poseidon.geography.grids.ModelGridFromGridFile
        gridFilePath: &id002 !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: *id001
          path: bathymetry_grid.asc
    path: *id002
  carryingCapacityGrid: &id005 !!uk.ac.ox.poseidon.biology.biomass.CarryingCapacityGridFactory
    grid: !!uk.ac.ox.poseidon.geography.grids.DoubleGridFromAllocatorFactory
      allocator: !!uk.ac.ox.poseidon.geography.allocators.FilteredAllocatorFactory
        cellPredicate: !!uk.ac.ox.poseidon.geography.predicates.IsActiveWaterCellFactory
          bathymetricGrid: *id003
        delegateAllocator: !!uk.ac.ox.poseidon.geography.allocators.SupplierAllocatorFactory
          doubleSupplier: !!uk.ac.ox.poseidon.core.suppliers.ConstantDoubleSupplierFactory
            value: !!uk.ac.ox.poseidon.core.quantities.KilogramsFactory
              mass: !!uk.ac.ox.poseidon.core.quantities.MassFactory {
                unitString: kg,
                value: 10.0
              }
      modelGrid: *id004
  biomassGrids: &id015 !!uk.ac.ox.poseidon.core.MappedFactory
    factory: !!uk.ac.ox.poseidon.biology.biomass.BiomassGridFactory
      biomassAllocator: !!uk.ac.ox.poseidon.biology.allocators.ProportionOfCarryingCapacityAllocatorFactory
        carryingCapacityGrid: *id005
        proportionSupplier: !!uk.ac.ox.poseidon.core.suppliers.ConstantDoubleSupplierFactory
          value: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
            value: 1.0
          }
      modelGrid: *id004
      species: null
    mappedProperties:
      species: *id006
  marketGrid: &id020 !!uk.ac.ox.poseidon.agents.market.BiomassMarketGridFromPriceTableFactory
    categoryCodeColumn: category_code
    currencyColumn: currency
    data: !!uk.ac.ox.poseidon.io.tables.CsvTableFactory
      dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
        encoding: UTF-8
        path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
          parent: *id001
          path: prices.csv
    dateColumn: date
    measurementUnitColumn: measurement_unit
    portCodeColumn: market_code
    portGrid: &id007 !!uk.ac.ox.poseidon.geography.ports.PortGridFactory
      bathymetricGrid: *id003
      distanceCalculator: &id009 !!uk.ac.ox.poseidon.geography.distance.HaversineDistanceCalculatorFactory
        modelGrid: *id004
      ports: !!uk.ac.ox.poseidon.geography.ports.PortsFromTableFactory
        latitudeColumnName: lat
        longitudeColumnName: lon
        portCodeColumnName: port_code
        portNameColumnName: port_name
        table: !!uk.ac.ox.poseidon.io.tables.CsvTableFactory
          dataSource: !!uk.ac.ox.poseidon.io.sources.FileDataSourceFactory
            encoding: UTF-8
            path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
              parent: *id001
              path: ports.csv
    priceColumn: price
    species: *id006
    speciesCodeColumn: species_code
  portGrid: *id007
  regulations: &id010 !!uk.ac.ox.poseidon.regulations.ForbiddenIfFactory
    actionPredicate: !!uk.ac.ox.poseidon.core.predicates.logical.AnyOfFactory
      predicates:
      - !!uk.ac.ox.poseidon.regulations.predicates.spatial.ActionCellPredicateFactory
        cellPredicate: !!uk.ac.ox.poseidon.core.predicates.AdaptedPredicateFactory
          adaptor: !!uk.ac.ox.poseidon.geography.grids.adaptors.CellValueFactory
            grid: *id003
          predicate: !!uk.ac.ox.poseidon.core.predicates.numeric.AboveFactory {
            threshold: -35.0
          }
        modelGrid: *id004
      - !!uk.ac.ox.poseidon.regulations.predicates.spatial.ActionCellPredicateFactory
        cellPredicate: !!uk.ac.ox.poseidon.core.predicates.InSetFactory
          values: !!uk.ac.ox.poseidon.geography.grids.CellSetFromGridFileFactory
            includedValue: 1.0
            path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
              parent: *id001
              path: french_eez.asc
        modelGrid: *id004
  vesselField: &id021 !!uk.ac.ox.poseidon.agents.fields.VesselFieldFactory
    modelGrid: *id004
  modelGrid: *id004
  monthlyProcesses: !!uk.ac.ox.poseidon.core.schedule.ScheduledRepeatingFactory
    interval: &id008 !!uk.ac.ox.poseidon.core.time.PeriodFactory {
      day: 0,
      month: 1,
      year: 0
    }
    ordering: -2
    startingDateTime: !!uk.ac.ox.poseidon.core.time.DateTimeAfterStartingFactory
      offset: *id008
    steppable: !!uk.ac.ox.poseidon.core.schedule.SteppableSequenceFactory
      steppables: !!uk.ac.ox.poseidon.core.utils.ListFactory
        factories:
        - !!uk.ac.ox.poseidon.core.events.EventClearerFactory
          eventAccumulator: !!uk.ac.ox.poseidon.agents.market.BiomassSaleAccumulatorFactory {
            }
        - !!uk.ac.ox.poseidon.core.events.EventClearerFactory
          eventAccumulator: !!uk.ac.ox.poseidon.agents.tasks.fishing.FishingEventAccumulatorFactory {
            }
  fleet: !!uk.ac.ox.poseidon.agents.vessels.FleetFromVesselRegisterFactory
    activationEventCodes: [
      CEN,
      CST,
      IMP,
      CHA
    ]
    behaviour: !!uk.ac.ox.poseidon.agents.vessels.VesselScopeFactoriesByCode
      code: null
      defaultFactory: !!uk.ac.ox.poseidon.agents.tasks.InactiveBehaviourFactory {
        }
      factories:
        PS: !!uk.ac.ox.poseidon.agents.tasks.BehaviourFactory
          rootTask: !!uk.ac.ox.poseidon.agents.tasks.branches.SequenceTaskFactory
            children:
            - !!uk.ac.ox.poseidon.agents.tasks.general.SucceedOrWaitTaskFactory
              guard: null
              mainTask: !!uk.ac.ox.poseidon.agents.tasks.branches.SequenceTaskFactory
                children:
                - &id016 !!uk.ac.ox.poseidon.agents.tasks.general.VesselPredicateTaskFactory
                  guard: null
                  predicate: !!uk.ac.ox.poseidon.core.predicates.logical.AllOfFactory
                    predicates:
                    - !!uk.ac.ox.poseidon.core.predicates.AdaptedPredicateFactory
                      adaptor: !!uk.ac.ox.poseidon.core.adaptors.temporal.CurrentTimeFactory {
                        }
                      predicate: !!uk.ac.ox.poseidon.core.predicates.temporal.TimeIsAfterFactory
                        referenceTime: !!uk.ac.ox.poseidon.core.time.TimeFactory {
                          hour: 21,
                          minute: 59,
                          second: 59
                        }
                    - !!uk.ac.ox.poseidon.core.predicates.AdaptedPredicateFactory
                      adaptor: !!uk.ac.ox.poseidon.core.adaptors.temporal.CurrentDayOfWeekFactory {
                        }
                      predicate: !!uk.ac.ox.poseidon.core.predicates.InSetFactory
                        values: !!uk.ac.ox.poseidon.core.utils.ObjectFactory
                          value: !!set {
                            !!java.time.DayOfWeek 'TUESDAY': null,
                            !!java.time.DayOfWeek 'WEDNESDAY': null,
                            !!java.time.DayOfWeek 'THURSDAY': null,
                            !!java.time.DayOfWeek 'MONDAY': null,
                            !!java.time.DayOfWeek 'SUNDAY': null
                          }
                - &id017 !!uk.ac.ox.poseidon.agents.tasks.destinations.StartTripFactory
                  destinationSupplier: !!uk.ac.ox.poseidon.agents.choices.EpsilonGreedyDestinationSupplierFactory
                    epsilon: 0.2
