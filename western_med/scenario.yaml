                    - !!uk.ac.ox.poseidon.regulations.predicates.IsPermittedPredicateFactory
                      actionFunction: !!uk.ac.ox.poseidon.agents.regulations.actions.DepartNowActionFunctionFactory {
                        }
                      regulations: *id009
                    - !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
