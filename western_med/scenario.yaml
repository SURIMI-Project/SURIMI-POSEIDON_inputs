            doubleFactory: !!uk.ac.ox.poseidon.core.quantities.KilogramsFactory
              mass: !!uk.ac.ox.poseidon.core.quantities.MassFactory {
                unitString: kg,
                value: 10.0
              }
      modelGrid: *id004
  biomassGrids: &id019 !!uk.ac.ox.poseidon.biology.biomass.BiomassGridsFactory
