                      optionPredicate: &id013 !!uk.ac.ox.poseidon.agents.regulations.predicates.FishingLocationLegalityCheckerFactory
                        distance: *id010
                        pathFinder: &id015 !!uk.ac.ox.poseidon.geography.paths.DefaultPathFinderFactory
                          bathymetricGrid: *id003
                          distance: *id010
                          pathCache: !!uk.ac.ox.poseidon.geography.paths.DefaultPathCacheFactory
