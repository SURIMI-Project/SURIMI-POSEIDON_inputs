                        }
                      predicate: !!uk.ac.ox.poseidon.core.predicates.temporal.AfterTimeFactory
                        referenceTime: !!uk.ac.ox.poseidon.core.time.TimeFactory {
                          hour: 21,
                          minute: 59,
                          second: 59
                        }
                    - !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
                      extractor: !!uk.ac.ox.poseidon.core.providers.temporal.CurrentDayOfWeekProviderFactory {
                        }
                      predicate: !!uk.ac.ox.poseidon.core.predicates.InSetFactory
                        values: !!uk.ac.ox.poseidon.core.utils.ObjectFactory
                          value: !!set {
                            !!java.time.DayOfWeek 'SUNDAY': null,
                            !!java.time.DayOfWeek 'MONDAY': null,
                            !!java.time.DayOfWeek 'TUESDAY': null,
                            !!java.time.DayOfWeek 'WEDNESDAY': null,
                            !!java.time.DayOfWeek 'THURSDAY': null
                          }
                - &id022 !!uk.ac.ox.poseidon.agents.tasks.destinations.StartTripFactory
                  destinationSupplier: !!uk.ac.ox.poseidon.agents.choices.EpsilonGreedyDestinationSupplierFactory
